# Each container's log is rotated: at most 3 files of 10 MB (docker compose logs reads them).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only reachable from the api container.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_DIR: /data
      # The site's limits: 800 MB per account, files smaller than 100 MB. Set here, they win over the
      # values in .env (servers set up from an older .env.example have 2048 and 200 there).
      UPLOAD_QUOTA_MB: "800"
      MAX_UPLOAD_MB: "100"
      # Uploads are checked for viruses by the clamav service. CLAMAV_HOST= (empty) in .env turns it off.
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: the first signature download takes minutes, and the API should not
      # wait for it. Until clamd answers, uploads are refused with 503 (scanner_unavailable).
      clamav:
        condition: service_started

  # Virus scanning of uploads with ClamAV (README → Virus scanning). Official image, "1.5_base":
  # the 1.5 feature-version tag, which ClamAV's image docs recommend for stability and security
  # (it moves to each 1.5.x patch release and base-image fix, never to a new feature version);
  # "_base" because it carries no signatures, which live in the clamav_db volume instead: the
  # first start downloads them (~250 MB, a few minutes), then freshclam inside the container
  # updates them. clamd keeps the signatures in memory: about 1-1.5 GB of RAM. Move the tag to a
  # newer feature version before ClamAV ends 1.5's support (its freshclam then stops updating).
  clamav:
    image: clamav/clamav:1.5_base
    restart: unless-stopped
    logging: *logging
    environment:
      # freshclam's update checks per day (the image's default is 1): every 4 hours.
      FRESHCLAM_CHECKS: 6
    volumes:
      - clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # Not published to the host: only the api reaches clamd, on port 3310 of the compose network.

  # Daily database dump + book files into ./backups, kept for BACKUP_KEEP_DAYS (see infra/backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./infra/backup.sh:/backup.sh:ro
      - ./data:/data:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Written into the prerendered landing page (structured data, canonical address, sign-up)
      args:
        PUBLIC_URL: ${PUBLIC_URL}
        ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
      # The site's public address, for robots.txt, the sitemap and the canonical link
      PUBLIC_URL: ${PUBLIC_URL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    # Behind another web server on the host, set HTTP_PORT/HTTPS_PORT to free local
    # ports in .env (README → Behind an existing web server).
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Android app downloads (README → Android app)
      - ./downloads:/var/www/downloads:ro
    depends_on:
      - api

volumes:
  pgdata:
  clamav_db:
  caddy_data:
  caddy_config:
