##
## clamd configuration of the "clamav" service (docker-compose.yml), mounted read-only over
## the image's /etc/clamav/clamd.conf. The first block is what the official image's own file
## sets (ClamAV's clamd.conf.sample with the image's changes); every other option keeps
## ClamAV's default. See `man clamd.conf` for the rest.
##
## Keep LocalSocket: the image's entrypoint waits for /tmp/clamd.sock before it reports clamd
## as started. Don't add CLAMD_CONF_* variables to the service either: the entrypoint edits
## this file in place with them, and it is read-only.
##

# ---- The image's defaults ----
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
# The image's health check sends PING to localhost:3310.
TCPSocket 3310
User clamav

# ---- BookRaven ----
# No TCPAddr: clamd listens on every address of the container, IPv4 and IPv6 (the health
# check's "localhost" is ::1). The port is not published to the host, so only containers on
# the compose network (the api) reach it.

# Nobody on the network may stop the daemon. RELOAD stays on: freshclam uses it to load
# new signatures right after each update.
EnableShutdownCommand no

# The API streams each upload with INSTREAM: allow the largest file (MAX_UPLOAD_MB is 100)
# with some room. clamd answers "INSTREAM size limit exceeded" above this.
StreamMaxLength 110M

# Archive limits. Comics are ZIP, RAR, 7z or TAR archives, and EPUB is a ZIP: a 100 MB
# archive can hold several times that once unpacked, so up to 400 MB is scanned per upload,
# and up to 110 MB per file inside it. Recursion and file counts stay at ClamAV's defaults,
# which stop archive bombs (17 levels, 10000 files).
MaxScanSize 400M
MaxFileSize 110M
MaxRecursion 17
MaxFiles 10000
# A scan stops after 2 minutes (ClamAV's default). The API waits a little longer for the answer.
MaxScanTime 120000
# A file over a limit is scanned as far as the limit, not reported as infected: an EPUB with
# many large images is not a virus.
AlertExceedsMax no
# Password-protected comics and PDFs are not flagged as viruses either.
AlertEncrypted no

# Signatures are kept in memory (about 1 to 1.5 GB). With the default "yes", a reload after
# each freshclam update builds a second engine next to the first, for a short while about
# twice that memory, and scans go on meanwhile. "no" keeps the peak at one engine on a small
# VPS; the trade-off is that scans wait (a few seconds to a minute) while the new signatures
# load, a few times a day.
ConcurrentDatabaseReload no

# Concurrent scans (uploads are rate-limited and one at a time per browser).
MaxThreads 4
