name: Deploy

# Every push to main that passes CI is deployed to the VPS. "Run workflow" in the
# Actions tab deploys the current main by hand. Setup: README → Automatic deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/mico-livrao' }}
      SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" bash -s -- "$APP_DIR" "$COMMIT" < infra/deploy.sh
