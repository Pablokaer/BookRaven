name: Deploy

# Every push to main that passes CI is deployed to the VPS. "Run workflow" in the
# Actions tab deploys the current main by hand. Setup: README → Automatic deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/mico-livrao' }}
      SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      # Writes the key and an `ssh vps` alias, then waits until the VPS answers (infra/ci-ssh.sh).
      - name: SSH to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash infra/ci-ssh.sh

      - name: Deploy
        run: ssh vps bash -s -- "$APP_DIR" "$COMMIT" < infra/deploy.sh

  # Android app (README → Android app): a signed APK and a live-update bundle of the web app,
  # built while the server deploys and published under /downloads once it is up. Skipped
  # until the ANDROID_KEYSTORE_BASE64 secret exists, and when nothing that goes into the app
  # changed since the published release.
  android-build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production # the VPS secrets live there
    timeout-minutes: 30
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/mico-livrao' }}
      SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Signing key
        id: key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, so the Android app is not built (README → Android app)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.enabled
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0 # the commit count is the APK's versionCode

      # The app talks to the server's PUBLIC_URL: the PUBLIC_URL variable, or the one in the server's .env.
      - name: Server URL
        if: steps.key.outputs.enabled
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            bash infra/ci-ssh.sh
            PUBLIC_URL=$(ssh vps "sed -n 's/^PUBLIC_URL=//p' '$APP_DIR/.env'" | tr -d '\r"' | tail -n 1)
          fi
          if [ -z "$PUBLIC_URL" ]; then echo "::error::PUBLIC_URL not found"; exit 1; fi
          echo "VITE_API_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      # Fingerprint of everything the app is built from (the web app without its tests, the
      # dependencies, this workflow, the server URL), stored in android.json as "inputs". When the
      # published release has the same one, there is nothing new to build. "Run workflow" always builds.
      - name: Changes
        id: changes
        if: steps.key.outputs.enabled
        run: |
          inputs=$(
            { git ls-files -s -- apps/web package.json pnpm-lock.yaml pnpm-workspace.yaml patches .github/workflows/deploy.yml infra/publish-android.sh \
                ':!*.test.ts' ':!*.test.tsx' ':!apps/web/vitest.config.ts' ':!apps/web/Dockerfile' ':!apps/web/scripts/precompress.mjs'
              echo "$VITE_API_URL"; } | sha256sum | cut -c1-16
          )
          echo "ANDROID_INPUTS=$inputs" >> "$GITHUB_ENV"
          published=$(curl -fsS --max-time 20 --retry 3 --retry-connrefused "$VITE_API_URL/downloads/android.json" | jq -r '.inputs // empty' || true)
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$published" = "$inputs" ]; then
            echo "::notice::The Android app did not change since the published release ($inputs), so it is not built again"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.build
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.build
        with:
          node-version: 22
          cache: pnpm
      # Gradle's downloads (the Android Gradle plugin, aapt2, libraries) are cached between runs.
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.build
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            apps/web/android/**/*.gradle*
            apps/web/android/gradle/wrapper/gradle-wrapper.properties
            pnpm-lock.yaml

      - name: Build
        if: steps.changes.outputs.build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$(git rev-list --count HEAD)
          export VERSION_NAME="1.$VERSION_CODE"
          export BUNDLE_VERSION=$(git rev-parse --short=12 HEAD)
          pnpm install --frozen-lockfile
          cd apps/web
          pnpm exec vite build --mode native
          pnpm exec cap sync android
          # Downloads from dl.google.com sometimes time out, so a failed Gradle build is tried again.
          for attempt in 1 2 3; do
            (cd android && ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME") && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Gradle build failed (attempt $attempt of 3), trying again"
            sleep 20
          done
          node scripts/android-release.mjs "$RUNNER_TEMP/android-release"

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.build
        with:
          name: android-release
          path: ${{ runner.temp }}/android-release
          retention-days: 7
    outputs:
      built: ${{ steps.changes.outputs.build }}

  android-publish:
    needs: [deploy, android-build]
    if: needs.android-build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/mico-livrao' }}
      SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: android-release

      - name: SSH to the VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash infra/ci-ssh.sh

      - name: Publish
        run: |
          tar -C android-release -czf - . | ssh vps "rm -rf '$APP_DIR/downloads/.incoming' && mkdir -p '$APP_DIR/downloads/.incoming' && tar -C '$APP_DIR/downloads/.incoming' -xzf -"
          ssh vps bash -s -- "$APP_DIR" < infra/publish-android.sh
