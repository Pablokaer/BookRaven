name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: readsync
          POSTGRES_PASSWORD: readsync
          POSTGRES_DB: readsync_test
        ports:
          - 5432:5432
        # Checked every second, so the job starts as soon as Postgres is up; it may take up to a minute.
        options: >-
          --health-cmd "pg_isready -U readsync -d readsync_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      DATABASE_URL: postgres://readsync:readsync@localhost:5432/readsync_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here uses git after the checkout
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build typechecks both apps (api: tsc -p tsconfig.json, web: tsc -b), so it stands in
      # for `pnpm typecheck` and runs first to fail fast.
      - name: Typecheck and build
        run: pnpm build
      - name: API tests (against the Postgres service)
        run: pnpm --filter api test
      - name: Web unit tests
        run: pnpm --filter web test
